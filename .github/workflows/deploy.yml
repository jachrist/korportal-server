name: Deploy til produksjon

# Deployer automatisk når endringer havner på main (typisk etter at en PR merges).
# Feature-brancher deployer IKKE — først når de er merget til main.
# workflow_dispatch gir en manuell «Run workflow»-knapp i Actions-fanen.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Ikke kjør to deployer samtidig; la en pågående fullføre.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Sett opp SSH-nøkkel
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ secrets.SSH_PORT || 22 }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # Kjører deploy.sh slik den er i den nye commiten (ikke den gamle kopien
      # på serveren), så endringer i selve skriptet gjelder fra første deploy.
      - name: Kjør deploy på serveren
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.SSH_PORT || 22 }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'cd /opt/korportal/src && git fetch -q --prune origin main &&
             tmp="$(mktemp)" && git show origin/main:deploy/deploy.sh > "$tmp" &&
             { DEPLOY_PREV="$(git rev-parse HEAD)" DEPLOY_REEXEC=1 bash "$tmp"; rc=$?; rm -f "$tmp"; exit $rc; }'
